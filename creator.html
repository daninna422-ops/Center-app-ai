
<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator App AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: linear-gradient(135deg, #1261d6, #673ab7);
      color: white;
      padding: 28px 18px;
      text-align: center;
    }

    .robot {
      font-size: 50px;
    }

    .header h1 {
      margin: 8px 0;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
      opacity: .95;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    .card h2 {
      margin-top: 0;
      color: #1261d6;
    }

    label.title {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #1261d6;
      box-shadow: 0 0 0 3px rgba(18,97,214,.08);
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid #d9deea;
      border-radius: 9px;
      background: #fafbfe;
      cursor: pointer;
      transition: .2s;
    }

    .feature:hover {
      border-color: #1261d6;
      background: #f4f8ff;
    }

    .feature input {
      width: auto;
      margin: 0;
    }

    .create-btn {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #1261d6, #673ab7);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    .create-btn:hover {
      transform: translateY(-1px);
    }

    .create-btn:disabled {
      background: #999;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      color: #a40000;
      background: #fff0f0;
      border: 1px solid #ffcaca;
      padding: 13px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
      line-height: 1.6;
    }

    .success {
      color: #086b35;
      background: #edfff4;
      border: 1px solid #b9efce;
      padding: 13px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #1261d6;
      margin-top: 15px;
      display: none;
      padding: 15px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #dce8ff;
      border-top-color: #1261d6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    #result {
      display: none;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .result-box {
      background: #f7f9fc;
      border: 1px solid #dce2ed;
      border-radius: 10px;
      padding: 15px;
      white-space: pre-wrap;
      line-height: 1.7;
      text-align: left;
      margin-top: 15px;
      max-height: 250px;
      overflow: auto;
    }

    .preview-title {
      margin-top: 25px;
      margin-bottom: 10px;
      font-weight: bold;
      color: #1261d6;
    }

    .preview-frame {
      width: 100%;
      height: 600px;
      border: 1px solid #dce2ed;
      border-radius: 12px;
      background: white;
      display: block;
    }

    .download-area {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: #f1f6ff;
      border: 1px solid #d7e5ff;
    }

    .download-area h3 {
      margin-top: 0;
      color: #1261d6;
    }

    .download-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .download-btn {
      border: none;
      border-radius: 9px;
      padding: 13px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      background: #1261d6;
      color: white;
    }

    .download-btn.zip {
      background: #673ab7;
      grid-column: 1 / -1;
      font-size: 17px;
      padding: 15px;
    }

    .download-btn:hover {
      opacity: .9;
    }

    .download-btn:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .files-info {
      margin-top: 12px;
      color: #667085;
      font-size: 14px;
      line-height: 1.6;
    }

    .back {
      display: block;
      text-align: center;
      margin: 25px 0;
      color: #1261d6;
      text-decoration: none;
      font-weight: bold;
    }

    .clear-btn {
      background: #fff;
      color: #d00000;
      border: 1px solid #ffcaca;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    @media (max-width: 600px) {

      .features {
        grid-template-columns: 1fr;
      }

      .download-buttons {
        grid-template-columns: 1fr;
      }

      .download-btn.zip {
        grid-column: auto;
      }

      .preview-frame {
        height: 520px;
      }

      .header h1 {
        font-size: 25px;
      }
    }
  </style
