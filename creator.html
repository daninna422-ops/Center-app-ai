<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator App AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #1261d6;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header .icon {
      font-size: 45px;
    }

    .header h1 {
      margin: 8px 0 5px;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #1261d6;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
      font-family: Arial, sans-serif;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #1261d6;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .feature {
      border: 1px solid #d9deea;
      padding: 12px;
      border-radius: 9px;
      cursor: pointer;
      background: #fafbfe;
      margin: 0;
      font-weight: normal;
    }

    .feature:hover {
      border-color: #1261d6;
      background: #f0f6ff;
    }

    .feature input {
      width: auto;
      margin-right: 7px;
    }

    .button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1261d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background: #0d4fae;
    }

    .button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 15px;
      padding: 14px;
      text-align: center;
      background: #eef5ff;
      color: #1261d6;
      border-radius: 10px;
      font-weight: bold;
    }

    #result {
      display: none;
    }

    .success {
      color: #087f3e;
      font-weight: bold;
    }

    .error {
      color: #d00000;
      background: #fff0f0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .result-box {
      background: #f7f9fc;
      border: 1px solid #dce2ed;
      border-radius: 10px;
      padding: 15px;
      line-height: 1.6;
      overflow-x: auto;
    }

    .code-section {
      margin-top: 18px;
    }

    .code-section h3 {
      color: #1261d6;
      margin-bottom: 8px;
    }

    pre {
      background: #111827;
      color: #e5e7eb;
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .action-btn {
      flex: 1;
      min-width: 140px;
      padding: 12px;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
      background: #1261d6;
      color: white;
    }

    .action-btn:hover {
      background: #0d4fae;
    }

    .preview {
      margin-top: 20px;
      border: 1px solid #dce2ed;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .preview-header {
      padding: 12px;
      background: #eef4ff;
      color: #1261d6;
      font-weight: bold;
    }

    iframe {
      width: 100%;
      height: 500px;
      border: 0;
      background: white;
    }

    .back {
      display: block;
      text-align: center;
      margin: 25px 0;
      color: #1261d6;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .features {
        grid-template-columns: 1fr;
      }

      .card {
        padding: 17px;
      }

      iframe {
        height: 450px;
      }
    }
  </style>
</head>

<body>

    <p>Gina app tare da taimakon AI</p>
