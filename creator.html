<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator App AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #1261d6;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    .robot {
      font-size: 48px;
    }

    .header h1 {
      margin: 8px 0;
      font-size: 29px;
    }

    .header p {
      margin: 0;
    }

    .container {
      max-width: 720px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #1261d6;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #1261d6;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .feature {
      background: #f8faff;
      border: 1px solid #dce2ed;
      padding: 12px;
      border-radius: 9px;
    }

    .feature input {
      width: auto;
    }

    .button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1261d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:disabled {
      background: #999;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }

    .ai-status {
      background: #eaf2ff;
      color: #1261d6;
    }

    .offline-status {
      background: #fff7df;
      color: #8a6500;
    }

    .error {
      background: #ffecec;
      color: #c00000;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      display: none;
    }

    #result {
      display: none;
    }

    .result-box {
      background: #f7f9fc;
      border: 1px solid #dce2ed;
      border-radius: 10px;
      padding: 18px;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .app-preview {
      margin-top: 20px;
      border: 1px solid #ddd;
      border-radius: 14px;
      overflow: hidden;
      background: white;
    }

    .preview-header {
      background: #1261d6;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .preview-body {
      padding: 20px;
    }

    .preview-button {
      display: inline-block;
      padding: 10px 14px;
      margin: 5px;
      border-radius: 8px;
      background: #1261d6;
      color: white;
      font-size: 14px;
    }

    .back {
      display: block;
      text-align: center;
      margin: 25px 0;
      color: #1261d6;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="robot">🤖</div>

    <h1>Creator App AI</h1>

    <p>Gina app tare da taimakon AI</p>

  </div>


  <div class="container">

    <div class="card">

      <h2>🚀 Ƙirƙiri sabon app</h2>

      <p>
        Bayyana app ɗin da kake son ginawa.
        AI zai taimaka, kuma idan Gemini baya aiki,
        Offline Creator zai ci gaba da tsara app ɗin.
      </p>


      <label>Sunan App</label>

      <input
        id="appName"
        type="text"
        placeholder="Misali: OpeyB+"
      >


      <label>Bayyana App ɗinka</label>

      <textarea
        id="appDescription"
        placeholder="Misali: Ina son app din Banki ne mai suna OpeyB+. Ya zama shafi fari, maballai da gumaka su zama blue..."
      ></textarea>


      <label>Nau'in App</label>

      <select id="category">

        <option value="General">
          General App
        </option>

        <option value="Banking">
          🏦 Banking
        </option>

        <option value="Business">
          💼 Business
        </option>

        <option value="Social Media">
          📱 Social Media
        </option>

        <option value="Education">
          📚 Education
        </option>

        <option value="Entertainment">
          🎬 Entertainment
        </option>

        <option value="AI">
          🤖 AI App
        </option>

      </select>


      <label>Features</label>

      <div class="features">

        <label class="feature">
          <input type="checkbox"
                 value="Login"
                 class="featureCheck">
          👤 Login
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="Dashboard"
                 class="featureCheck">
          🏠 Dashboard
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="Database"
                 class="featureCheck">
          🗄️ Database
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="Chat AI"
                 class="featureCheck">
          🤖 Chat AI
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="Payment"
                 class="featureCheck">
          💳 Payment
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="User Profile"
                 class="featureCheck">
          👤 Profile
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="Notifications"
                 class="featureCheck">
          🔔 Notifications
        </label>

        <label class="feature">
          <input type="checkbox"
                 value="API"
                 class="featureCheck">
          🔑 API
        </label>

      </div>


      <button
        class="button"
        id="createButton"
        onclick="createApp()">

        ✨ Fara Ƙirƙirar App

      </button>


      <div
        id="status"
        class="status">
      </div>


      <div
        id="error"
        class="error">
      </div>

    </div>


    <div
      class="card"
      id="result">

      <h2>📱 Tsarin App ɗinka</h2>

      <div
        id="resultBox"
        class="result-box">
      </div>


      <div
        id="preview"
        class="app-preview">
      </div>

    </div>


    <a
      class="back"
      href="dashboard.html">

      ⬅ Komawa Dashboard

    </a>

  </div>


<script>

async function createApp() {

  const appName =
    document.getElementById("appName")
      .value.trim();

  const description =
    document.getElementById("appDescription")
      .value.trim();

  const category =
    document.getElementById("category")
      .value;

  const button =
    document.getElementById("createButton");

  const status =
    document.getElementById("status");

  const error =
    document.getElementById("error");

  const result =
    document.getElementById("result");

  const resultBox =
    document.getElementById("resultBox");

  const preview =
    document.getElementById("preview");


  status.style.display = "none";
  error.style.display = "none";


  if (!appName) {

    error.textContent =
      "Rubuta sunan app ɗinka.";

    error.style.display = "block";

    return;
  }


  if (!description) {

    error.textContent =
      "Bayyana abin da app ɗin zai yi.";

    error.style.display = "block";

    return;
  }


  const selectedFeatures =
    Array.from(
      document.querySelectorAll(".featureCheck:checked")
    ).map(item => item.value);


  button.disabled = true;

  button.textContent =
    "⏳ Ana ƙirƙira...";


  /*
    ========================================
    TRY AI FIRST
    ========================================
  */

  try {

    status.className =
      "status ai-status";

    status.textContent =
      "🤖 Ana neman taimakon AI...";

    status.style.display =
      "block";


    const prompt = `
Kai ne Creator App AI.

Ka taimaka wa mai amfani tsara app.

Sunan App:
${appName}

Nau'in App:
${category}

Bayani:
${description}

Features:
${selectedFeatures.join(", ") || "Babu"}

Ka ba da cikakken tsarin app cikin Hausa.

Ka bayyana:
1. Sunan app
2. Manufarsa
3. Launin UI
4. Pages
5. Buttons
6. Icons
7. Features
8. Database
9. APIs
10. Matakan gina app.

Idan app ɗin banki ne,
ka yi la'akari da Login, Balance,
Deposit, Withdraw, Transfer,
Transaction History da Profile.
`;


    const response =
      await fetch(
        "/api/chat",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            message: prompt
          })
        }
      );


    const data =
      await response.json()
        .catch(() => ({}));


    if (!response.ok) {
      throw new Error(
        data.error ||
        "AI backend error"
      );
    }


    if (!data.reply) {
      throw new Error(
        "AI bai dawo da amsa ba."
      );
    }


    /*
      AI SUCCESS
    */

    showResult(
      data.reply,
      appName,
      category,
      selectedFeatures
    );


    status.className =
      "status ai-status";

    status.textContent =
      "🤖 AI ya tsara app ɗinka.";

    status.style.display =
      "block";


  } catch (aiError) {

    /*
      =====================================
      AI FAILED → OFFLINE FALLBACK
      =====================================
    */

    console.log(
      "AI failed, using offline fallback:",
      aiError
    );


    status.className =
      "status offline-status";

    status.textContent =
      "📴 Gemini baya samuwa yanzu. Offline Creator yana aiki.";

    status.style.display =
      "block";


    const offlineResult =
      offlineCreator(
        appName,
        description,
        category,
        selectedFeatures
      );


    showResult(
      offlineResult.text,
      appName,
      category,
      offlineResult.features
    );

  }


  button.disabled = false;

  button.textContent =
    "✨ Fara Ƙirƙirar App";

}


/*
========================================
OFFLINE CREATOR
========================================
*/

function offlineCreator(
  appName,
  description,
  category,
  selectedFeatures
) {

  const text =
    description.toLowerCase();


  let features =
    [...selectedFeatures];


  /*
    BANK DETECTION
  */

  if (
    category === "Banking" ||
    text.includes("bank") ||
    text.includes("banki")
  ) {

    const bankFeatures = [
      "Login",
      "Dashboard",
      "Account Balance",
      "Deposit",
      "Withdraw",
      "Transfer",
      "Transaction History",
      "User Profile",
      "Notifications"
    ];


    bankFeatures.forEach(
      feature => {

        if (!features.includes(feature)) {
          features.push(feature);
        }

      }
    );

  }


  /*
    SOCIAL MEDIA
  */

  if (
    category === "Social Media" ||
    text.includes("social") ||
    text.includes("facebook") ||
    text.includes("tiktok")
  ) {

    [
      "Login",
      "Home Feed",
      "Profile",
      "Posts",
      "Messages",
      "Notifications"
    ].forEach(feature => {

      if (!features.includes(feature)) {
        features.push(feature);
      }

    });

  }


  /*
    AI APP
  */

  if (
    category === "AI" ||
    text.includes("ai")
  ) {

    [
      "Login",
      "Chat AI",
      "AI History",
      "User Profile"
    ].forEach(feature => {

      if (!features.includes(feature)) {
        features.push(feature);
      }

    });

  }


  /*
    DEFAULT
  */

  if (features.length === 0) {

    features = [
      "Home",
      "Dashboard",
      "User Profile",
      "Settings"
    ];

  }


  let pages = [
    "Home",
    "Dashboard"
  ];


  if (features.includes("Login")) {
    pages.unshift("Login");
  }


  features.forEach(feature => {

    if (
      !pages.includes(feature) &&
      feature !== "Login"
    ) {

      pages.push(feature);

    }

  });


  /*
    COLORS
  */

  let colors =
    "Fari background + Blue buttons da icons";


  if (
    text.includes("green") ||
    text.includes("kore")
  ) {

    colors =
      "Fari background + Green buttons da icons";

  }


  if (
    text.includes("red") ||
    text.includes("ja")
  ) {

    colors =
      "Fari background + Red buttons da icons";

  }


  if (
    text.includes("black") ||
    text.includes("baki")
  ) {

    colors =
      "Fari background + Black buttons da icons";

  }


  const result =

`CENTER APP AI
━━━━━━━━━━━━━━━━━━━━

📱 SUNAN APP:
${appName}

🏷️ NAU'IN APP:
${category}

🎯 MANUFAR APP:
${description}

🎨 UI / COLORS:
${colors}

📄 PAGES:
${pages.map(
  (page, i) =>
    `${i + 1}. ${page}`
).join("\n")}

⚙️ FEATURES:
${features.map(
  feature =>
    "• " + feature
).join("\n")}

🔘 BUTTONS:
• Primary Button
• Secondary Button
• Navigation Buttons
• Action Buttons

🔵 ICONS:
• Home
• User
• Settings
• Notifications
• Back
• Menu

🗄️ DATABASE:
• Users
• Profiles
• App Settings
• Transactions / App Data

🔑 API:
API za a ƙara ne idan app ɗin yana buƙatar
backend ko wani external service.

🚀 NEXT STEP:
Za mu iya amfani da wannan tsarin
mu fara gina UI na app ɗin.

━━━━━━━━━━━━━━━━━━━━
Creator App AI Offline Mode`;


  return {
    text: result,
    features: features
  };

}


/*
========================================
SHOW RESULT
========================================
*/

function showResult(
  text,
  appName,
  category,
  features
) {

  const result =
    document.getElementById("result");

  const resultBox =
    document.getElementById("resultBox");

  const preview =
    document.getElementById("preview");


  resultBox.textContent =
    text;


  /*
    SIMPLE APP PREVIEW
  */

  const isBank =
    category === "Banking";


  const buttons =
    isBank
      ? [
          "💰 Balance",
          "💳 Deposit",
          "💸 Transfer",
          "📤 Withdraw",
          "📜 Transactions"
        ]
      : [
          "🏠 Home",
          "👤 Profile",
          "⚙️ Settings",
          "🔔 Notifications"
        ];


  preview.innerHTML = `

    <div class="preview-header">

      <strong>
        ${escapeHtml(appName)}
      </strong>

      <br>

      <small>
        App Preview
      </small>

    </div>


    <div class="preview-body">

      <h3>
        Welcome to ${escapeHtml(appName)}
      </h3>

      ${buttons.map(
        button =>
          `<span class="preview-button">
             ${button}
           </span>`
      ).join("")}

    </div>

  `;


  result.style.display =
    "block";


  result.scrollIntoView({
    behavior: "smooth"
  });

}


/*
========================================
SECURITY
========================================
*/

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text;

  return div.innerHTML;

}

</script>

</body>
</html>
