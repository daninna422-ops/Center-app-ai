<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator App AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fb;
      color: #172033;
    }

    .top {
      background: #1261d6;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    .robot {
      font-size: 45px;
    }

    .top h1 {
      margin: 8px 0;
    }

    .top p {
      margin: 0;
    }

    .container {
      max-width: 850px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: 0 3px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #1261d6;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin: 15px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      font-family: inherit;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .feature {
      border: 1px solid #d9dfeb;
      border-radius: 9px;
      padding: 12px;
      cursor: pointer;
      background: #fafbfd;
    }

    .feature input {
      width: auto;
      margin-right: 7px;
    }

    .create {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 16px;
      margin-top: 20px;
      background: #1261d6;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    .create:disabled {
      background: #999;
    }

    .error {
      color: #d00000;
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

    .status {
      display: none;
      padding: 12px;
      margin-top: 15px;
      background: #eef5ff;
      border-radius: 9px;
      text-align: center;
    }

    /* APP PREVIEW */

    #previewSection {
      display: none;
    }

    .preview-wrap {
      background: #20242c;
      padding: 25px 15px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
    }

    .phone {
      width: 340px;
      max-width: 100%;
      min-height: 590px;
      background: white;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
      position: relative;
    }

    .phone-top {
      height: 28px;
      background: #111;
    }

    .app-header {
      background: #1261d6;
      color: white;
      padding: 20px;
    }

    .app-header h3 {
      margin: 0;
      font-size: 22px;
    }

    .app-header p {
      margin: 7px 0 0;
      opacity: .9;
      font-size: 13px;
    }

    .app-content {
      padding: 18px;
    }

    .balance {
      background: #eef5ff;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .balance small {
      color: #667085;
    }

    .balance strong {
      display: block;
      font-size: 27px;
      margin-top: 7px;
      color: #1261d6;
    }

    .app-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .app-button {
      padding: 16px 8px;
      border: 1px solid #dce2ec;
      background: white;
      border-radius: 12px;
      text-align: center;
      font-weight: bold;
      cursor: pointer;
    }

    .app-button:hover {
      background: #eef5ff;
    }

    .login-screen {
      padding: 25px 18px;
    }

    .login-screen h3 {
      text-align: center;
      color: #1261d6;
      font-size: 25px;
    }

    .login-screen input {
      margin-top: 10px;
    }

    .login-btn {
      width: 100%;
      border: 0;
      background: #1261d6;
      color: white;
      padding: 14px;
      border-radius: 9px;
      margin-top: 15px;
      font-weight: bold;
    }

    .bottom-nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      border-top: 1px solid #ddd;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 12px;
    }

    .bottom-nav div {
      text-align: center;
      color: #555;
    }

    .bottom-nav .active {
      color: #1261d6;
      font-weight: bold;
    }

    .code-box {
      background: #111827;
      color: #d1fae5;
      padding: 15px;
      border-radius: 10px;
      max-height: 300px;
      overflow: auto;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 12px;
      display: none;
    }

    .secondary {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border: 1px solid #1261d6;
      color: #1261d6;
      background: white;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      color: #1261d6;
      text-decoration: none;
      font-weight: bold;
      margin: 25px 0;
    }

    @media (max-width: 520px) {
      .features {
        grid-template-columns: 1fr;
      }

      .phone {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="top">

    <div class="robot">🛠️</div>

    <h1>Creator App AI</h1>

    <p>Rubuta ra'ayin app ɗinka, mu gina maka preview</p>

  </div>


  <div class="container">

    <!-- FORM -->

    <div class="card">

      <h2>🚀 Ƙirƙiri App</h2>

      <label for="appName">
        Sunan App
      </label>

      <input
        id="appName"
        type="text"
        placeholder="Misali: Mubarak Bank"
      >


      <label for="description">
        Menene app ɗin zai yi?
      </label>

      <textarea
        id="description"
        placeholder="Misali: Ina son app na banki mai login, balance, transfer da transaction history."
      ></textarea>


      <label for="category">
        Nau'in App
      </label>

      <select id="category">

        <option value="Banking">
          🏦 Banking
        </option>

        <option value="Business">
          💼 Business
        </option>

        <option value="Social">
          👥 Social Media
        </option>

        <option value="Education">
          📚 Education
        </option>

        <option value="Entertainment">
          🎬 Entertainment
        </option>

        <option value="AI">
          🤖 AI App
        </option>

        <option value="General">
          📱 General App
        </option>

      </select>


      <label>
        Features
      </label>

      <div class="features">

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Login">
          🔐 Login
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Dashboard">
          🏠 Dashboard
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Database">
          🗄️ Database
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Payment">
          💳 Payment
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Chat AI">
          🤖 Chat AI
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Profile">
          👤 Profile
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="Notifications">
          🔔 Notifications
        </label>

        <label class="feature">
          <input type="checkbox" class="featureCheck" value="API">
          🔑 API
        </label>

      </div>


      <button
        class="create"
        id="createButton"
        onclick="createApp()"
      >
        ✨ Ƙirƙiri App
      </button>


      <div
        class="status"
        id="status"
      >
        🤖 AI yana tsara app ɗinka...
      </div>


      <div
        class="error"
        id="error"
      ></div>

    </div>


    <!-- PREVIEW -->

    <div
      class="card"
      id="previewSection"
    >

      <h2>📱 App Preview</h2>

      <p>
        Wannan shi ne preview na app ɗin da Creator App AI ya tsara.
      </p>


      <div class="preview-wrap">

        <div class="phone">

          <div class="phone-top"></div>

          <div
            id="phoneContent"
          ></div>

          <div class="bottom-nav">

            <div class="active">
              🏠<br>Home
            </div>

            <div>
              📊<br>Dashboard
            </div>

            <div>
              👤<br>Profile
            </div>

            <div>
              ⚙️<br>Settings
            </div>

          </div>

        </div>

      </div>


      <button
        class="secondary"
        onclick="toggleCode()"
      >
        💻 Nuna Generated Code
      </button>


      <pre
        id="codeBox"
        class="code-box"
      ></pre>

    </div>


    <a
      class="back"
      href="dashboard.html"
    >
      ⬅️ Komawa Dashboard
    </a>

  </div>


  <script>

    const BACKEND_URL = "/api/chat";


    async function createApp() {

      const appName =
        document.getElementById("appName").value.trim();

      const description =
        document.getElementById("description").value.trim();

      const category =
        document.getElementById("category").value;

      const button =
        document.getElementById("createButton");

      const status =
        document.getElementById("status");

      const error =
        document.getElementById("error");

      const preview =
        document.getElementById("previewSection");


      error.textContent = "";

      if (!appName) {
        error.textContent =
          "Rubuta sunan app.";
        return;
      }

      if (!description) {
        error.textContent =
          "Bayyana abin da app ɗin zai yi.";
        return;
      }


      const features =
        Array.from(
          document.querySelectorAll(
            ".featureCheck:checked"
          )
        ).map(
          item => item.value
        );


      button.disabled = true;

      status.style.display = "block";

      status.textContent =
        "🤖 AI yana tsara app ɗinka...";


      const prompt = `
Kai ne Creator App AI.

Ka taimaka wajen ƙirƙirar tsarin app.

Sunan app:
${appName}

Nau'in app:
${category}

Abin da mai amfani yake so:
${description}

Features:
${features.length ? features.join(", ") : "Basic features"}

Ka fahimci ra'ayin app ɗin sannan ka ba da taƙaitaccen bayani.
Ka yi amfani da Hausa.
`;


      try {

        /*
          AI REQUEST
        */

        const response =
          await fetch(
            BACKEND_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                message: prompt
              })
            }
          );


        const data =
          await response.json()
          .catch(
            () => ({})
          );


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Backend Error: " +
            response.status
          );
        }


        /*
          KO AI YA AMSA KO A'A,
          ZA MU GINA PREVIEW.
        */

        const aiReply =
          data.reply || "";


        createPreview(
          appName,
          category,
          description,
          features,
          aiReply
        );


        status.textContent =
          "✅ An ƙirƙiri App Preview!";


        preview.style.display =
          "block";


        preview.scrollIntoView({
          behavior: "smooth"
        });


      } catch (err) {

        /*
          Idan Gemini quota ta ƙare,
          har yanzu muna iya nuna
          basic preview.
        */

        createPreview(
          appName,
          category,
          description,
          features,
          ""
        );


        status.textContent =
          "📱 An ƙirƙiri Basic App Preview.";

        preview.style.display =
          "block";

        preview.scrollIntoView({
          behavior: "smooth"
        });

        console.error(err);

      } finally {

        button.disabled = false;

      }

    }


    function createPreview(
      appName,
      category,
      description,
      features,
      aiReply
    ) {

      const phone =
        document.getElementById(
          "phoneContent"
        );


      /*
        BANKING APP
      */

      if (
        category === "Banking" ||
        /bank|banki/i.test(description)
      ) {

        phone.innerHTML = `

          <div class="app-header">

            <h3>
              ${escapeHtml(appName)}
            </h3>

            <p>
              Welcome Back 👋
            </p>

          </div>


          <div class="app-content">

            <div class="balance">

              <small>
                Available Balance
              </small>

              <strong>
                ₦25,000.00
              </strong>

            </div>


            <div class="app-buttons">

              <div
                class="app-button"
                onclick="demoAction('Deposit')"
              >
                💰<br>
                Deposit
              </div>

              <div
                class="app-button"
                onclick="demoAction('Withdraw')"
              >
                💸<br>
                Withdraw
              </div>

              <div
                class="app-button"
                onclick="demoAction('Transfer')"
              >
                🔄<br>
                Transfer
              </div>

              <div
                class="app-button"
                onclick="demoAction('History')"
              >
                📜<br>
                History
              </div>

            </div>

          </div>

        `;

      }

      /*
        DEFAULT APP
      */

      else {

        phone.innerHTML = `

          <div class="app-header">

            <h3>
              ${escapeHtml(appName)}
            </h3>

            <p>
              Your App
            </p>

          </div>


          <div class="app-content">

            <div class="balance">

              <small>
                About this app
              </small>

              <strong
                style="font-size:18px;"
              >
                ${escapeHtml(
                  description.substring(
                    0,
                    100
                  )
                )}
              </strong>

            </div>


            <div class="app-buttons">

              ${
                features.length
                ?
                features.map(
                  feature => `
                    <div
                      class="app-button"
                      onclick="demoAction('${escapeHtml(feature)}')"
                    >
                      ${getIcon(feature)}
                      <br>
                      ${escapeHtml(feature)}
                    </div>
                  `
                ).join("")
                :
                `
                  <div class="app-button">
                    🏠<br>Home
                  </div>

                  <div class="app-button">
                    ⚙️<br>Settings
                  </div>
                `
              }

            </div>

          </div>

        `;

      }


      /*
        GENERATED CODE PREVIEW
      */

      const generatedCode =
`<!DOCTYPE html>
<html lang="ha">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>${appName}</title>
</head>

<body>

<h1>${appName}</h1>

<p>${description}</p>

<h2>Category</h2>
<p>${category}</p>

<h2>Features</h2>
<ul>
${
  features
    .map(
      f => `<li>${f}</li>`
    )
    .join("\n")
}

</ul>

</body>
</html>`;


      document.getElementById(
        "codeBox"
      ).textContent =
        generatedCode;

    }


    function getIcon(feature) {

      const icons = {

        "Login": "🔐",

        "Dashboard": "🏠",

        "Database": "🗄️",

        "Payment": "💳",

        "Chat AI": "🤖",

        "Profile": "👤",

        "Notifications": "🔔",

        "API": "🔑"

      };

      return icons[feature] || "📱";

    }


    function demoAction(name) {

      alert(
        name +
        " feature na demo ne.\n" +
        "Za mu haɗa shi da backend/database daga baya."
      );

    }


    function toggleCode() {

      const box =
        document.getElementById(
          "codeBox"
        );

      if (
        box.style.display === "block"
      ) {

        box.style.display =
          "none";

      } else {

        box.style.display =
          "block";

      }

    }


    function escapeHtml(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text || "";

      return div.innerHTML;

    }

  </script>

</body>
</html>
