<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creator App AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    .header {
      background: #1261d6;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    .robot {
      font-size: 50px;
    }

    .header h1 {
      margin: 8px 0;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      font-size: 16px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border-radius: 16px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-top: 0;
      color: #1261d6;
    }

    label.title {
      display: block;
      font-weight: bold;
      margin-top: 18px;
      margin-bottom: 8px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccd3df;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 140px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #1261d6;
    }

    .features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .feature {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid #d9deea;
      border-radius: 9px;
      background: #fafbfe;
      cursor: pointer;
    }

    .feature input {
      width: auto;
      margin: 0;
    }

    .create-btn {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #1261d6;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .create-btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .error {
      color: #d00000;
      background: #fff0f0;
      padding: 12px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    .loading {
      text-align: center;
      color: #1261d6;
      margin-top: 15px;
      display: none;
    }

    #result {
      display: none;
    }

    .result-box {
      background: #f7f9fc;
      border: 1px solid #dce2ed;
      border-radius: 10px;
      padding: 15px;
      white-space: pre-wrap;
      line-height: 1.7;
      text-align: left;
    }

    .back {
      display: block;
      text-align: center;
      margin: 25px 0;
      color: #1261d6;
      text-decoration: none;
      font-weight: bold;
    }

    @media (max-width: 500px) {
      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="robot">🛠️</div>

    <h1>Creator App AI</h1>

    <p>Gina app tare da taimakon AI</p>

  </div>


  <div class="container">

    <div class="card">

      <h2>🚀 Ƙirƙiri Sabon App</h2>

      <p>
        Bayyana app ɗin da kake son ƙirƙira.
        Creator App AI zai taimaka maka tsara tsarin app ɗin.
      </p>


      <label class="title" for="appName">
        Sunan App
      </label>

      <input
        id="appName"
        type="text"
        placeholder="Misali: Mubarak Bank"
      >


      <label class="title" for="description">
        Menene app ɗin zai yi?
      </label>

      <textarea
        id="description"
        placeholder="Misali: Ina son app na banki mai login, balance, transfer da transaction history."
      ></textarea>


      <label class="title" for="category">
        Nau'in App
      </label>

      <select id="category">

        <option value="General App">
          General App
        </option>

        <option value="Banking App">
          Banking App
        </option>

        <option value="Business App">
          Business App
        </option>

        <option value="Social Media App">
          Social Media App
        </option>

        <option value="Education App">
          Education App
        </option>

        <option value="Entertainment App">
          Entertainment App
        </option>

        <option value="AI App">
          AI App
        </option>

      </select>


      <label class="title">
        Abubuwan da kake so a cikin app
      </label>


      <div class="features">

        <label class="feature">
          <input
            type="checkbox"
            value="Login"
            class="featureCheck"
          >
          Login
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="Dashboard"
            class="featureCheck"
          >
          Dashboard
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="Database"
            class="featureCheck"
          >
          Database
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="Chat AI"
            class="featureCheck"
          >
          Chat AI
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="Payment"
            class="featureCheck"
          >
          Payment
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="User Profile"
            class="featureCheck"
          >
          User Profile
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="Notifications"
            class="featureCheck"
          >
          Notifications
        </label>

        <label class="feature">
          <input
            type="checkbox"
            value="API"
            class="featureCheck"
          >
          API
        </label>

      </div>


      <button
        id="createButton"
        class="create-btn"
        onclick="createApp()"
      >
        ✨ Fara Ƙirƙirar App
      </button>


      <div id="loading" class="loading">
        🤖 Creator App AI yana tsara app ɗinka...
      </div>


      <div id="error" class="error"></div>

    </div>


    <div
      id="result"
      class="card"
    >

      <h2>📱 Tsarin App ɗinka</h2>

      <div
        id="resultBox"
        class="result-box"
      ></div>

    </div>


    <a
      class="back"
      href="dashboard.html"
    >
      ⬅ Komawa Dashboard
    </a>

  </div>


  <script>

    async function createApp() {

      const appName =
        document.getElementById("appName").value.trim();

      const description =
        document.getElementById("description").value.trim();

      const category =
        document.getElementById("category").value;

      const button =
        document.getElementById("createButton");

      const loading =
        document.getElementById("loading");

      const errorBox =
        document.getElementById("error");

      const result =
        document.getElementById("result");

      const resultBox =
        document.getElementById("resultBox");


      errorBox.style.display = "none";
      errorBox.textContent = "";

      result.style.display = "none";


      if (!appName) {

        showError(
          "Rubuta sunan app ɗinka."
        );

        return;
      }


      if (!description) {

        showError(
          "Bayyana abin da app ɗin zai yi."
        );

        return;
      }


      const selectedFeatures =
        Array.from(
          document.querySelectorAll(".featureCheck:checked")
        ).map(
          checkbox => checkbox.value
        );


      const features =
        selectedFeatures.length > 0
          ? selectedFeatures.join(", ")
          : "Babu takamaiman features";


      const prompt = `
Kai ne Creator App AI na Center App AI.

Mai amfani yana son ƙirƙirar app.

SUNAN APP:
${appName}

NAU'IN APP:
${category}

BAYANIN APP:
${description}

FEATURES:
${features}

Ka taimaka masa tsara app ɗin.

Ka ba shi:

1. Sunan app
2. Manufar app
3. Muhimman pages/screens
4. Features
5. Yadda pages ɗin za su haɗu
6. Database da ake bukata
7. APIs da ake bukata
8. Login/Auth idan ana bukata
9. Matakan gina app
10. Shawarar yadda za a fara

Ka amsa cikin Hausa mai sauƙin fahimta.
`;


      button.disabled = true;
      button.textContent = "Ana ƙirƙirawa...";

      loading.style.display = "block";


      try {

        const response =
          await fetch(
            "/api/chat",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                message: prompt
              })
            }
          );


        const data =
          await response.json().catch(
            () => ({})
          );


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Backend ya dawo da error: " +
            response.status
          );
        }


        if (!data.reply) {

          throw new Error(
            "AI bai dawo da amsa ba."
          );
        }


        resultBox.textContent =
          data.reply;

        result.style.display =
          "block";


        result.scrollIntoView({
          behavior: "smooth"
        });


      } catch (error) {

        showError(
          error.message
        );

      } finally {

        button.disabled = false;

        button.textContent =
          "✨ Fara Ƙirƙirar App";

        loading.style.display =
          "none";
      }

    }


    function showError(message) {

      const errorBox =
        document.getElementById("error");

      errorBox.textContent =
        "Error: " + message;

      errorBox.style.display =
        "block";
    }

  </script>

</body>
</html>
