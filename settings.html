<!DOCTYPE html>
<html lang="ha">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Center App AI - Settings</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      transition: 0.3s;
    }

    .header {
      background: #1261d6;
      color: white;
      padding: 25px 18px;
      text-align: center;
    }

    .header .icon {
      font-size: 45px;
    }

    .header h1 {
      margin: 8px 0;
      font-size: 28px;
    }

    .header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #1261d6;
      margin-top: 0;
    }

    .setting {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid #e5e8ee;
      gap: 15px;
    }

    .setting:last-child {
      border-bottom: none;
    }

    .setting-info {
      flex: 1;
    }

    .setting-title {
      font-weight: bold;
      font-size: 16px;
    }

    .setting-description {
      color: #687386;
      font-size: 13px;
      margin-top: 5px;
      line-height: 1.4;
    }

    select {
      padding: 10px;
      border: 1px solid #ccd3df;
      border-radius: 8px;
      background: white;
      font-size: 14px;
    }

    /* Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 29px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
